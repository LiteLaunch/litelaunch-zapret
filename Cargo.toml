[package]
name = "zapret"
version = "1.0.0"
edition = "2024"
description = "zapret-discord-youtube config picker for LiteLaunch"
license = "MIT"

[lib]
path = "zapret.rs"
crate-type = ["cdylib"]

[dependencies]
# Built inside the launcher's checkout, where this repository is the submodule plugins/zapret.
litelaunch-plugin = { path = "../../sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding stays on: the SDK catches a panic instead of letting it take the launcher down.
panic = "unwind"
